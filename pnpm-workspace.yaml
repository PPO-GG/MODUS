packages:
  - "bot"
  - "web"
  - "packages/*"
allowBuilds:
  '@discordjs/opus': true
  esbuild: true
  ffmpeg-static: true
  vue-demi: true
patchedDependencies:
  '@discordjs/voice': bot/patches/@discordjs__voice.patch
overrides:
  h3: ^1.15.11
  nitropack: '>=2.13.4'
  devalue: '>=5.8.1'
  fast-xml-parser: '>=5.7.0'
  fast-xml-builder: '>=1.2.0'
  esbuild: '>=0.28.1'
  tar: '>=7.5.16'
  brace-expansion: '>=5.0.7'
  undici@6: ^6.27.0
  undici@7: ^7.28.0
  shell-quote: '>=1.9.0'
  svgo: '>=4.1.0'
  fflate: ^0.7.5
  nanoid: ~3.3.17
  '@tiptap/core': '>=3.30.4'
  '@tiptap/pm': '>=3.30.4'
  # Nitro's output tracer mis-copies unhead when two versions coexist
  # (nuxt pinned 3.2.3, @nuxt/ui + nuxt-og-image pulled 3.4.1), leaving
  # .output/server/node_modules/unhead without dist/legacy.mjs at runtime.
  unhead: ^3.4.1
  '@unhead/vue': ^3.4.1
  '@unhead/bundler': ^3.4.1
